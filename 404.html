<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found — NIET Lost & Found</title>
    <meta name="description" content="The page you're looking for doesn't exist." />

    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NIET Lost & Found" />
    <meta property="og:title" content="Page Not Found — NIET Lost & Found" />
    <meta property="og:description" content="The page you're looking for doesn't exist." />
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Page Not Found — NIET Lost & Found" />
    <meta property="twitter:description" content="The page you're looking for doesn't exist." />

    <meta name="theme-color" content="#0f172a" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <style>
      .error-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .error-page__content {
        max-width: 480px;
      }
      .error-page__code {
        font-size: clamp(5rem, 20vw, 10rem);
        font-weight: 900;
        background: linear-gradient(135deg, var(--secondary), var(--accent));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1;
        margin-bottom: 16px;
        font-family: 'Merriweather', serif;
      }
      .error-page__title {
        font-size: 1.5rem;
        font-weight: 800;
        margin-bottom: 12px;
        color: var(--primary);
      }
      .error-page__desc {
        color: var(--text-secondary);
        margin-bottom: 32px;
        font-size: 1rem;
        line-height: 1.6;
      }
      .error-page__actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body>
    <div class="error-page">
      <div class="error-page__content">
        <div class="error-page__code">404</div>
        <h1 class="error-page__title">Page Not Found</h1>
        <p class="error-page__desc">
          Oops! The page you're looking for doesn't exist or has been moved.
          Let's get you back on track.
        </p>
        <div class="error-page__actions">
          <a href="index.html" class="btn btn--primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            Go Home
          </a>
          <a href="report.html" class="btn btn--outline">
            Report a Lost Item
          </a>
        </div>
      </div>
    </div>

    <script>
      // Apply saved theme
      const theme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', theme);
    </script>
  </body>
</html>
