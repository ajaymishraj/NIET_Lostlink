<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eaf3ff" />
      <stop offset="100%" stop-color="#f7f9fc" />
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1">
      <stop offset="0%" stop-color="#0b3d91" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#b8860b" stop-opacity="0.03" />
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.06" />
      </feComponentTransfer>
      <feBlend mode="overlay" />
    </filter>
  </defs>

  <!-- soft diagonal band -->
  <rect width="1600" height="900" fill="url(#g1)" />
  <g opacity="0.6" transform="translate(-200,-100) rotate(-12 800 450)">
    <rect x="0" y="0" width="1000" height="1200" fill="url(#g2)" />
  </g>

  <!-- campus silhouette (abstract) -->
  <g transform="translate(0,560) scale(1,0.65)" fill="#07224d" opacity="0.06">
    <rect x="40" y="40" width="160" height="220" rx="8" />
    <rect x="220" y="80" width="120" height="180" rx="6" />
    <rect x="360" y="20" width="220" height="240" rx="6" />
    <rect x="620" y="60" width="160" height="200" rx="6" />
    <rect x="820" y="40" width="300" height="220" rx="6" />
    <rect x="1180" y="80" width="260" height="180" rx="6" />
  </g>

  <!-- subtle emblem in center top -->
  <g transform="translate(800,160)" opacity="0.06">
    <circle r="80" fill="#0b3d91" />
    <path d="M-30,10 L0,-40 L30,10 Z" fill="#fff" opacity="0.06" />
  </g>

  <!-- soft texture layer -->
  <rect width="1600" height="900" fill="none" filter="url(#grain)" />
</svg>
